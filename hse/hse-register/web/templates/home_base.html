{{define "homebase"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    @view-transition { navigation: auto; }
    html { background: #fafafa; }
    ::view-transition-group(root) { animation-duration: 120ms; }
    @media (prefers-reduced-motion: reduce) {
      ::view-transition-group(root) { animation: none; }
    }
  </style>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{.Title}} · HSE Register</title>
  <link rel="icon" type="image/png" href="/static/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet" /></noscript>
  <link rel="stylesheet" href="/static/register/clearwave/templatemo-622-clearwave.css?v=20261016u" />
  <link rel="stylesheet" href="/static/register/clearwave/app.css?v=20261016u" />
  <link rel="stylesheet" href="/static/register/admin-clearwave.css?v=20261020b" />
</head>
<body class="settings-theme{{if eq .Zone "settings"}} area-settings{{end}}">
  <nav class="nav scrolled" role="navigation" aria-label="Main navigation">
    <div class="nav-inner">
      <a href="/start" class="nav-logo">hse <span>register</span></a>
      <div class="nav-cta">
        <span class="btn-ghost" style="pointer-events:none">{{.Session.Username}}</span>
        <form method="post" action="/logout" style="display:inline">
          <button type="submit" class="btn-primary">Log out</button>
        </form>
      </div>
    </div>
  </nav>

  <div class="login-wrap">
    <div class="login-card login-card--wide">
      {{template "main" .}}
    </div>
  </div>

  <footer class="app-dev-credit">
    <p>Developed by Minhajul Mubarok, dr. Arif Rahman Hakim.</p>
    <p>Internal HSE record-keeping only.</p>
  </footer>
</body>
</html>
{{end}}
